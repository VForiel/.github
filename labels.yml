# Common labels, created or updated by scripts/sync-labels.sh (never deleted).
# "was": former name, renamed in place so that the issues keep their label.
# Dependabot, if added to a repository, needs `labels: ["📦 dependencies"]` in its configuration.
- name: 🐛 bug
  was: bug
  color: d73a4a
  description: Something does not work or gives a wrong result
- name: ✨ enhancement
  was: enhancement
  color: a2eeef
  description: New feature or request
- name: 📝 documentation
  was: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: ❓ question
  was: question
  color: d876e3
  description: Further information is requested
- name: 🔍 triage
  was: triage
  color: fbca04
  description: Not looked at by the maintainer yet
- name: 🔒 security
  was: security
  color: b60205
  description: Security problem or hardening
- name: ⚡ performance
  was: performance
  color: 5319e7
  description: Speed, memory or page weight
- name: ♿ accessibility
  was: accessibility
  color: f143ab
  description: Barrier affecting people with disabilities
- name: 📦 dependencies
  was: dependencies
  color: 0366d6
  description: Updates a dependency
- name: 🌱 good first issue
  was: good first issue
  color: 7057ff
  description: Good for newcomers
- name: 🙋 help wanted
  was: help wanted
  color: 008672
  description: Extra attention is needed
- name: 👯 duplicate
  was: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: 🚫 invalid
  was: invalid
  color: e4e669
  description: This does not seem right
- name: 🙅 wontfix
  was: wontfix
  color: ffffff
  description: This will not be worked on
