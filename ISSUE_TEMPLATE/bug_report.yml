name: 🐛 Bug report
description: Something does not work, or gives a wrong result
labels: ["🐛 bug", "🔍 triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: 💥 What happened
      description: The error message, or the result and why it looks wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 🎯 What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 How to reproduce
      description: The shortest example or list of steps that shows the problem (code, page address, clicks).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 🏷️ Version
      description: Version of the project, and of Python, the browser or the system when relevant.
  - type: textarea
    id: more
    attributes:
      label: 📎 Anything else
      description: Logs, screenshots, links.
